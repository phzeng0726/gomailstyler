<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome With Custom Functions</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333333;
      }
      p {
        color: #555555;
        line-height: 1.6;
      }
      .highlight {
        background-color: #ffffcc;
        padding: 10px;
        border-left: 4px solid #ffcc00;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome, {{ .Name }}!</h1>
      <p>Thank you for joining us. We're excited to have you on board!</p>

      <div class="highlight">
        <p>Custom Functions Demo:</p>
        <p>Repeated greeting: {{ repeat "Hello! " 3 }}</p>
        <p>Uppercase name: {{ toUpper .Name }}</p>
      </div>

      <p>Best regards,<br />The Team</p>
    </div>
  </body>
</html>
